<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8" />
    <!-- 移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- 网站图标 -->
    <link rel="icon" type="image/webp" href="./assets/icons/icon.webp" />
    <title>Music Icee</title>
    <!-- 样式文件引入 -->
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/common.css">
    <link rel="stylesheet" type="text/css" href="css/rules.css">
    <link rel="stylesheet" type="text/css" href="css/response.css">

</head>

<body>
    <!-- 引入图标定义文件 -->
    <div id="svg-icons-container"></div>

    <div id="app">
        <div class="app_layout">
            <section class="layout-left">
                <!-- 头部导航栏 -->
                <header class="list_header flex" list_header>
                    <div class="list-tab" role="tablist" aria-label="音乐分类">
                        <button class="tab-A active" type="button" role="tab" aria-selected="true" data-tab="tab-A">全部</button>
                        <button class="tab-B" type="button" role="tab" aria-selected="false" data-tab="tab-B">轻音乐</button>
                        <button class="tab-C" type="button" role="tab" aria-selected="false" data-tab="tab-C">伤感治愈</button>
                        <button class="tab-D" type="button" role="tab" aria-selected="false" data-tab="tab-D">流行经典</button>
                        <button class="tab-E" type="button" role="tab" aria-selected="false" data-tab="tab-E">史诗配乐</button>
                        <button class="tab-F" type="button" role="tab" aria-selected="false" data-tab="tab-F">节奏律动</button>
                        <button class="tab-G" type="button" role="tab" aria-selected="false" data-tab="tab-G">动漫影视</button>
                        <button class="tab-H" type="button" role="tab" aria-selected="false" data-tab="tab-H">怀旧金曲</button>
                        <button class="tab-I" type="button" role="tab" aria-selected="false" data-tab="tab-I">民谣</button>
                    </div>
                </header>

                <div class="left-scroll">
                    <!-- 歌单列表容器 -->
                    <div class="wrapper-contentList" content-list></div>
                </div>
            </section>

            <section class="layout-right">
                <main class="main-wrap">
                    <!-- 歌曲播放面板 -->
                    <!-- 背景图片 -->
                    <img class="imgBoard" currentPlay-img400 title="..." alt="">

                    <!-- 歌曲播放控制面板 -->
                    <div class="song_panel" song-panel>
                        <button class="panel-close" type="button" panel-close-btn aria-label="关闭歌词面板"></button>
                        <button class="song-download-btn flex" type="button" download-current-audio
                            aria-label="下载当前音频" title="下载音频">
                            <svg fill="none" stroke="currentColor" class="icon" stroke-width="3.5"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <use href="#icon-download"></use>
                            </svg>
                        </button>
                        <!-- 面板主要内容 -->
                        <div class="panel-content flex">
                            <!-- 歌曲信息区域 -->
                            <div class="content-left flex">
                                <div class="left-songInfo flex">
                                    <div class="songInfo-img flex">
                                        <img class="img" src="" alt="..." play-img-board currentPlay-img400>
                                    </div>
                                    <div class="songInfo-item flex">
                                        <div class="song-name">
                                            <span title="" class="name text-ol fs-20 fw-6"
                                                currentPlay-name></span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 歌词显示 -->
                            <div class="content-right">
                                <div class="right-wrap" wrap-lyrics>
                                    <div class="wrap-lyrics" play-lyrics>
                                        <!-- 歌词内容将通过JavaScript动态插入 -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </section>
        </div>

        <!-- 悬浮窗容器（仍保留，用于动态信息） -->
        <div id="hoverWindow" class="hover-window">
            <div id="hoverContent" class="hover-content"></div>
        </div>

        <!-- 底部播放控制栏 -->
        <footer class="app_footer" id="app-footer">
            <div class="songs_play flex">
                <!-- 播放控制区域 -->
                <div class="play-control flex">
                    <div class="control-items flex">
                        <div class="items-btn flex">
                            <!-- 上一首 -->
                            <button class="btn-prev flex" type="button" play-prev-btn id="btn-prev" aria-label="上一首">
                                <svg fill="none" stroke="currentColor" class="icon" stroke-width="5"
                                    stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
                                    <use href="#icon-prev"></use>
                                </svg>
                            </button>
                            <!-- 播放/暂停按钮 -->
                            <button class="btn-play pause flex" type="button" play-btn id="btn-play" aria-label="播放或暂停">
                                <svg fill="none" stroke="currentColor" class="icon pause" stroke-width="5"
                                    stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
                                    <use href="#icon-play"></use>
                                </svg>
                                <svg fill="none" stroke="currentColor" class="icon playing" stroke-width="5"
                                    stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
                                    <use href="#icon-pause"></use>
                                </svg>
                            </button>
                            <!-- 下一首按钮 -->
                            <button class="btn-next flex" type="button" play-next-btn id="btn-next" aria-label="下一首">
                                <svg fill="none" stroke="currentColor" class="icon" stroke-width="5"
                                    stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
                                    <use href="#icon-next"></use>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- 进度条控制 -->
                    <div class="control-progress flex">
                        <span class="progress-currentTime" play-currentTime>00:00</span>
                        <div class="progress-bar">
                            <input class="range" play-Progress type="range" value="0" min="0" max="100" step="1"
                                aria-label="底部歌曲进度">
                            <div class="progress-colorFill" play-colorFill></div>
                        </div>
                        <span class="progress-totalTime" play-totalTime>00:00</span>
                    </div>
                </div>

                <!-- 播放设置区域 -->
                <div class="play-setting flex">
                    <button class="footer-current-song text-ol" type="button" lyrics-panel-toggle
                        aria-label="打开当前歌曲和歌词">
                        <span currentPlay-name>...</span>
                    </button>
                    <div class="setting-options flex">
                        <!-- 循环模式切换 -->
                        <button class="options-circulationMode flex listLoop" type="button" play-mode aria-label="切换播放模式">
                            <svg class="icon listLoop" aria-hidden="true">
                                <use href="#icon-liebiaoxunhuan"></use>
                            </svg>
                            <svg class="icon randomLoop" aria-hidden="true">
                                <use href="#icon-suijibofang1"></use>
                            </svg>
                            <svg class="icon singleLoop" aria-hidden="true">
                                <use href="#icon-danquxunhuan1"></use>
                            </svg>
                        </button>
                        <!-- 音量控制 -->
                        <button class="options-sound flex sound" type="button" play-volume-icon aria-label="静音切换">
                            <svg fill="none" stroke="currentColor" class="icon sound" stroke-width="4"
                                stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
                                <use href="#icon-volume"></use>
                            </svg>
                            <svg fill="none" stroke="currentColor" class="icon mute" stroke-width="4"
                                stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true">
                                <use href="#icon-mute"></use>
                            </svg>
                        </button>
                        <!-- 音量滑块 -->
                        <div class="options-soundSlider flex">
                            <input type="range" play-volume-range min="0" max="1" value="0.8" step="0.01"
                                aria-label="音量调节">
                            <div class="progress-colorFill" play-volume-colorFill></div>
                        </div>
                    </div>
                </div>
            </div>
        </footer>

        <div class="app-notice" app-notice role="status" aria-live="polite"></div>
    </div>

    <!-- JavaScript模块引入 -->
    <script>
        // 加载SVG图标
        fetch('./assets/icons/svg-icons.html')
            .then(response => response.text())
            .then(svgContent => {
                const iconContainer = document.getElementById('svg-icons-container');
                if (iconContainer) {
                    iconContainer.innerHTML = svgContent;
                }
            })
            .catch(error => console.error('加载图标失败:', error));
    </script>
    <script type="module" src="app/theme-manager.js"></script>
    <script type="module" src="app/app.js"></script>
</body>

</html>
